<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>安全审计报告 PDF</title>
  <style>
    @page { size: A4; margin: 14mm 12mm; }
    /* 字体栈按平台排列：Linux(Noto CJK) → Windows(雅黑) → macOS(苹方) → 兜底。
       Linux/Docker 上必须安装 fonts-noto-cjk，否则中文会渲染成方块。
       注意：不要再往前面插其它字体名。实测在前面多加几个候选（Noto Sans SC /
       WenQuanYi 等）会让 Chromium 换用另一套字体回退路径，导致 PDF 体积翻倍
       且中文字体不再以可识别的名字内嵌。 */
    body { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; color: #0f172a; font-size: 12px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    h2 { margin: 16px 0 8px; font-size: 16px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; }
    h3 { margin: 0 0 8px; font-size: 13px; color: #334155; }
    .meta { color: #475569; margin: 0 0 4px; }
    .muted { color: #64748b; }
    .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0 14px; }
    .card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; }
    .lbl { font-size: 10px; text-transform: uppercase; color: #64748b; }
    .val { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .c1 { color: #b91c1c; } .c2 { color: #c2410c; } .c3 { color: #a16207; } .c4 { color: #1d4ed8; }
    .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0 14px; }
    .panel { border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; }
    .bar { display: grid; grid-template-columns: 90px 1fr 34px; gap: 6px; align-items: center; margin: 4px 0; font-size: 11px; }
    .track { height: 7px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: #0ea5e9; border-radius: 999px; }
    .count { text-align: right; color: #475569; font-family: Consolas, monospace; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 6px 4px; text-align: left; vertical-align: top; }
    th { background: #f8fafc; color: #475569; }
    .finding { page-break-inside: avoid; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; margin: 8px 0; }
    .finding h4 { margin: 0 0 6px; font-size: 13px; }
    .group { margin: 14px 0 6px; font-size: 13px; color: #0f172a; background: #f1f5f9; border-left: 3px solid #0ea5e9; padding: 4px 8px; }
    pre { white-space: pre-wrap; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; font-size: 10px; }
  </style>
</head>
<body>
  <h1>{{PROJECT_NAME}}</h1>
  <p class="meta">{{SCAN_META}}</p>
  <p class="meta">{{TIMING}}</p>
  <p class="meta">报告范围：{{SCOPE}}</p>
  <p class="meta">在线详情：{{ONLINE_URL}}</p>

  {{CARDS}}

  <h2>分布统计</h2>
  <div class="charts">
    {{CHARTS}}
  </div>

  <h2>漏洞汇总</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th><th>危害</th><th>漏洞描述</th><th>OWASP</th><th>来源</th><th>位置</th>
      </tr>
    </thead>
    <tbody>
      {{TABLE_ROWS}}
    </tbody>
  </table>

  <h2>漏洞详情</h2>
  {{DETAIL_ROWS}}
</body>
</html>
